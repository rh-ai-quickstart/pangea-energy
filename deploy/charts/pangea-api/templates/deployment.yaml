apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangea-api
  labels:
    app.kubernetes.io/name: pangea-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pangea-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangea-api
    spec:
      serviceAccountName: pangea-mlflow
      containers:
        - name: api
          image: "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}/pangea-api:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # Runtime-tunable knobs; explicit env: below wins on name clashes.
          envFrom:
            - configMapRef:
                name: pangea-api-config
            - configMapRef:
                name: pangea-api-prompt
          env:
            - name: POSTGRES_HOST
              value: "pangea-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: CORS_ORIGINS
              value: "*"
            # Solar prediction: in-cluster KServe v2 endpoint for the
            # solar-output model + public Open-Meteo weather API.
            - name: SOLAR_MODEL_URL
              value: "http://solar-output-predictor.{{ .Release.Namespace }}.svc.cluster.local/v2/models/solar-output/infer"
            - name: OPEN_METEO_URL
              value: "https://api.open-meteo.com/v1/forecast"
            # WIND_CUTOUT_MS comes from the pangea-api-config ConfigMap.
            - name: NBM_GENERATOR_BEARING_URL
              value: "http://wind-generator-bearing-predictor.{{ .Release.Namespace }}.svc.cluster.local/v2/models/wind-generator-bearing/infer"
            - name: NBM_GEARBOX_OIL_URL
              value: "http://wind-gearbox-oil-predictor.{{ .Release.Namespace }}.svc.cluster.local/v2/models/wind-gearbox-oil/infer"
            # Voice STT (in-cluster Whisper predictor).
            - name: WHISPER_URL
              value: "http://whisper-tiny-predictor.{{ .Release.Namespace }}.svc.cluster.local/v1/audio/transcriptions"
            - name: WHISPER_MODEL
              value: "whisper-tiny"
            - name: WHISPER_LANGUAGE
              value: "en"
            - name: TTS_GATEWAY_URL
              value: "http://pangea-tts.{{ .Release.Namespace }}.svc.cluster.local/speak"
            # Conversational agent LLM: Granite 4.0 350M on vLLM CPU (KServe).
            - name: AGENT_LLM_URL
              value: "http://granite4-predictor.{{ .Release.Namespace }}.svc.cluster.local/v1/chat/completions"
            - name: AGENT_LLM_MODEL
              value: "granite4"
            - name: LAYA_URL
              value: "http://laya-predictor-predictor.{{ .Release.Namespace }}.svc.cluster.local/v1/models/laya-predictor:predict"
            - name: MLFLOW_TRACKING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pangea-mlflow-token
                  key: token
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pangea-db-credentials
                  key: database-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pangea-db-credentials
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pangea-db-credentials
                  key: database-password
          volumeMounts:
            - name: soul
              mountPath: /etc/pangea
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: soul
          configMap:
            name: pangea-api-soul
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: pangea-api
  labels:
    app.kubernetes.io/name: pangea-api
spec:
  selector:
    app.kubernetes.io/name: pangea-api
  ports:
    - name: http
      port: 8080
      targetPort: http
