apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pangea-db
  labels:
    app.kubernetes.io/name: pangea-db
    app.kubernetes.io/part-of: pangea-power
spec:
  serviceName: pangea-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pangea-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangea-db
      annotations:
        # Roll the pod when the schema/seed ConfigMap changes.
        checksum/initdb: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # No runAsUser/fsGroup: OpenShift's restricted-v2 SCC assigns a random UID
      # and an fsGroup. The pgvector image runs fine that way as long as PGDATA is
      # a sub-directory of the (group-writable) mounted volume and the socket dir
      # is writable -- both handled below.
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pangea-db-credentials, key: database-name }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: pangea-db-credentials, key: database-user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pangea-db-credentials, key: database-password }
            # PGDATA must be a sub-dir of the mount so initdb can create/own it
            # under an arbitrary UID (the mount root is owned by root:fsGroup).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["bash", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["bash", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: initdb
          configMap:
            name: pangea-db-initdb
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storageSize | quote }}
