{{- $pw := .Values.credentials.password }}
{{- if not $pw }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace "pangea-db-credentials" }}
  {{- if and $existing $existing.data (hasKey $existing.data "database-password") }}
    {{- $pw = index $existing.data "database-password" | b64dec }}
  {{- else }}
    {{- $pw = randAlphaNum 24 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pangea-db-credentials
  labels:
    app.kubernetes.io/name: pangea-db
    app.kubernetes.io/part-of: pangea-power
type: Opaque
stringData:
  database-name: {{ .Values.credentials.database | quote }}
  database-user: {{ .Values.credentials.user | quote }}
  database-password: {{ $pw | quote }}
