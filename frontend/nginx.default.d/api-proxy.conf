# Reverse-proxy API calls to the backend Service so the browser talks to the UI
# same-origin (no CORS). Included inside the server{} block of the ubi9/nginx
# image via /opt/app-root/etc/nginx.default.d/.
location /api/ {
    proxy_pass http://pangea-api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}
